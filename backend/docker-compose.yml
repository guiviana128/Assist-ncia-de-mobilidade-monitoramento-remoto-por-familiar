version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: assistmob-postgres
    environment:
      POSTGRES_DB: assistmob_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assistmob_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
