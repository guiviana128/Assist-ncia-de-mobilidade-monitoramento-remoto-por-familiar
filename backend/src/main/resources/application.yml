server:
  port: 8080

spring:
  application:
    name: assistmob-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/assistmob_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Configurações do Firebase Cloud Messaging (FCM)
firebase:
  enabled: false # Mudar para true ao fornecer o serviceAccountKey.json
  config-path: classpath:firebase-service-account.json

# Parâmetros de monitoramento
assistmob:
  geofence:
    default-radius-meters: 500.0
    safe-zone-latitude: -23.550520
    safe-zone-longitude: -46.633308
