server:
  port: 8080

spring:
  application:
    name: assistmob-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/assistmob_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Configurações do Firebase Cloud Messaging (FCM)
firebase:
  enabled: false # Mudar para true ao fornecer o serviceAccountKey.json
  config-path: classpath:firebase-service-account.json

# Parâmetros de monitoramento e IA local
assistmob:
  geofence:
    default-radius-meters: 500.0
    safe-zone-latitude: -23.550520
    safe-zone-longitude: -46.633308
  robot:
    default-id: ${ASSISTMOB_ROBOT_ID:AMPARO-BOT-01}
    default-person-room: sala
  security:
    # false = API aberta como antes do pentest (somente para reproduzir os ataques do relatório)
    enabled: ${ASSISTMOB_SECURITY_ENABLED:true}
    device-api-key: ${ASSISTMOB_DEVICE_API_KEY:dev-device-key-troque-em-producao}
    family-username: ${ASSISTMOB_FAMILY_USER:familia}
    family-password: ${ASSISTMOB_FAMILY_PASSWORD:amparo2050}
    token-ttl-minutes: 480
    cors-origins: ${ASSISTMOB_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  ai:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2:3b}
